# Version de modèle de l'application Robust-ASR, écrite par scripts/export_model.py.
#
# model      : hyperparamètres du Config du notebook (mêmes noms). Ils ne figurent pas dans le
#              checkpoint : le chargement strict des poids vérifie qu'ils lui correspondent.
# decoding   : beam search joint CTC / attention du notebook (beam 10, poids CTC 0.3), ou
#              ctc_greedy, plus rapide sur CPU.
# limits     : durées acceptées. Au-delà de 30 s, la transcription se dégrade fortement (le modèle
#              n'a pas vu d'énoncé plus long à l'entraînement) ; au-delà d'environ 240 s, elle échoue.
# sha256     : empreintes vérifiées à chaque chargement.

format: 1
version: v1
description: Transformer hybride CTC / attention avec QK-norm, LibriSpeech 960 h, 60 époques
language: en
files:
  checkpoint: best.pt
  cmvn: cmvn.pt
sha256:
  checkpoint: 0059bb70a809712fad43d329179a9de9e05478efbf990f4ab6c9553a3e105a92
  cmvn: d46e66429ae6a88fa7b99bd240887a1a527b432a7ae3a4f6cbf18bb76e201fc7
model:
  sample_rate: 16000
  n_mels: 80
  n_fft: 512
  win_length: 400
  hop_length: 160
  freq_masks: 2
  freq_mask_width: 27
  time_masks: 2
  time_mask_width: 40
  d_model: 256
  n_heads: 4
  d_ffn: 2048
  encoder_layers: 12
  decoder_layers: 6
  conv_channels: 32
  dropout: 0.1
  qk_norm: true
  ctc_weight: 0.3
  label_smoothing: 0.1
  beam_size: 10
tokenizer:
  type: char
  chars: ' ''ABCDEFGHIJKLMNOPQRSTUVWXYZ'
decoding:
  method: joint_beam_search
  beam_size: 10
  ctc_weight: 0.3
  use_corrector: false
limits:
  min_duration_s: 0.1
  max_duration_s: 30.0
